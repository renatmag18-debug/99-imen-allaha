<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>99ism — сайт отключён</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09212b;color:#f4eddd;font:20px system-ui;text-align:center}main{padding:32px}h1{font-size:28px}</style><main><h1>Сайт отключён</h1></main><script>if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if("caches" in window)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));</script></html>
