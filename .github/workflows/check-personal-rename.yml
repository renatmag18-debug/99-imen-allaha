name: Verify personal progress rename without deployment
on:
  push:
    branches: [draft/safe-rename-progress]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < cloudflare-worker.js
      - run: node --test tests/personal-progress.test.mjs tests/personal-rename.test.mjs tests/worker-rename.integration.test.mjs
