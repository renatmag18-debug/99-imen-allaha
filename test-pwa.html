<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PWA Test">
<meta name="theme-color" content="#0a2129">
<title>PWA Test</title>
<link rel="manifest" href="manifest-test.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{height:100%; height:-webkit-fill-available; margin:0;padding:0;}
  body{
    background:red;
    overflow:hidden;
    min-height:100%;
    min-height:-webkit-fill-available;
  }
  #box{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    min-height:-webkit-fill-available;
    /* iOS standalone bug found via measurement: innerHeight/dvh under-report
       by exactly safe-area-inset-top on notch/Dynamic-Island devices, even
       though content already paints correctly under the status bar. Add it
       back. Resolves to +0px anywhere the bug doesn't apply. */
    min-height:calc(100dvh + env(safe-area-inset-top, 0px));
    background:linear-gradient(180deg, lime 0%, lime 10%, blue 10%, blue 90%, yellow 90%, yellow 100%);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:sans-serif; font-size:16px; text-align:left;
  }
  #info{ background:rgba(0,0,0,0.6); padding:16px; border-radius:12px; line-height:1.7; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="box">
<div id="info">measuring…</div>
</div>
<div id="sat-probe" style="position:fixed; visibility:hidden; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);"></div>
<script>
function report(){
  const de = document.documentElement;
  const lines = [
    'innerHeight: ' + window.innerHeight,
    'innerWidth: ' + window.innerWidth,
    'visualViewport.height: ' + (window.visualViewport ? window.visualViewport.height : 'n/a'),
    'visualViewport.offsetTop: ' + (window.visualViewport ? window.visualViewport.offsetTop : 'n/a'),
    'clientHeight (html): ' + de.clientHeight,
    'scrollHeight (html): ' + de.scrollHeight,
    'screen.height: ' + screen.height,
    'screen.availHeight: ' + screen.availHeight,
    'devicePixelRatio: ' + window.devicePixelRatio,
    'safe-area-inset-top: ' + getComputedStyle(document.getElementById('sat-probe')).paddingTop,
    'safe-area-inset-bottom: ' + getComputedStyle(document.getElementById('sat-probe')).paddingBottom,
    'box.getBoundingClientRect().height: ' + document.getElementById('box').getBoundingClientRect().height,
    'body.getBoundingClientRect().height: ' + document.body.getBoundingClientRect().height,
    'standalone: ' + window.navigator.standalone,
    'displayMode standalone: ' + window.matchMedia('(display-mode: standalone)').matches
  ];
  document.getElementById('info').textContent = lines.join('\n');
}
report();
window.addEventListener('resize', report);
window.addEventListener('orientationchange', report);
if(window.visualViewport) window.visualViewport.addEventListener('resize', report);
setTimeout(report, 500);
setTimeout(report, 1500);
</script>
</body>
</html>
